<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>User Registration</title>
</head>
<body class="user-registration-page">
    <div class="user-registration-form-box">
        <p><span id="user-registration-form-box-title">Register Account!</span> <br> Fill in details to register for your account</p>
        
        {% if registration_error %}
            <p role="alert">{{ registration_error }}</p>
        {% endif %}
        <form class="user-registration-form" action="{{ url_for('user_registration') }}" method="POST">
            <div class="form-group">
                <label for="full_name">Full Name:</label> <br>
                <input type="text" name="full_name" id="full_name" placeholder="Enter your full name" maxlength="100" required>
            </div> <br>
            <div class="form-group">
                <label for="email">Email:</label> <br>
                <input type="email" name="email" id="email" placeholder="Enter your email" maxlength="100" required>
            </div> <br>
            <div class="form-group">
                <label for="password">Password:</label> <br>
                <div class="password-input-wrap">
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">
                        <svg class="eye-icon eye-icon-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-icon eye-icon-closed" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path>
                        </svg>
                    </button>
                </div>
            </div><br>
            <div class="form-group">
                <label for="confirm_password">Confirm Password:</label> <br>
                <div class="password-input-wrap">
                    <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm your password" required>
                    <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Show password" aria-pressed="false">
                        <svg class="eye-icon eye-icon-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-icon eye-icon-closed" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path>
                        </svg>
                    </button>
                </div>
            </div> <br>
            <button type="submit"><span id="user-registration-form-button-text">Sign Up</span></button>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
    <script src="{{ url_for('static', filename='js/jquery.js') }}"></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
