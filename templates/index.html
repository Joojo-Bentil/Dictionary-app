{% extends 'base.html' %}

{% block title %}
    <title>Dictionary App</title>
{% endblock %}

{% block home_active %}
    class="active"
{% endblock %}
   
{% block content %}
    <div class="row">
        <div class="col-md-6">
            <h1>The Dictionary App</h1>
            <div class="row">
                <div class="col-sm-6">
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="word">Word:</label>
                            <input 
                            type="text" 
                            class="form-control" 
                            placeholder="Enter in the word here:" 
                            name="word" 
                            id="word"
                            required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg">Search</button>
                    </form>
                </div>
                <div class="col-sm-6">
                    <form action="">
                        <div class="form-group">
                            <label for="meaning">Meaning:</label>
                            <textarea class="form-control" placeholder="The meaning of the word shows here:" id="meaning" disabled> {{ user_response }} </textarea>
                        </div>
                    </form>                    
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <img src="{{ url_for('static', filename='images/search.jpg') }}" alt="">
        </div>
    </div>
{% endblock %}
